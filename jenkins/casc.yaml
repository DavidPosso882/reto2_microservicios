# Reto 7 P2 — Aprovisionamiento de pipelines como código (Opción A: JCasC + job-dsl).
# Al levantar Jenkins con `docker compose up`, estos jobs ya existen: cada uno
# lee su Jenkinsfile versionado junto al código (microservicios/gestion-empleados/Jenkinsfile,
# microservicios/gestion-vacaciones/Jenkinsfile) del repo montado en /workspace, rama del reto.
# Decisión: JCasC frente a init.groovy.d porque es declarativo, se revisa como
# YAML y el plugin configuration-as-code ya viene pre-instalado (P1).
jenkins:
  systemMessage: "Proyecto Final — CI del ecosistema (jobs aprovisionados como código)"
  numExecutors: 2

jobs:
  - script: >
      pipelineJob('empleados-service') {
        description('CI empleados-service (Java 21 + Maven). Jenkinsfile: microservicios/gestion-empleados/Jenkinsfile.')
        // Polling P5-automatización: file:///workspace no admite webhook;
        // Jenkins revisa la rama cada ~2 min y dispara solo con cambio nuevo.
        triggers {
          scm('H/2 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///workspace')
                }
                branches('*/main')
              }
            }
            scriptPath('microservicios/gestion-empleados/Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('vacaciones-service') {
        description('CI vacaciones-service (Ruby 3.3 + Minitest). Jenkinsfile: microservicios/gestion-vacaciones/Jenkinsfile.')
        // Polling P5-automatización: file:///workspace no admite webhook;
        // Jenkins revisa la rama cada ~2 min y dispara solo con cambio nuevo.
        triggers {
          scm('H/2 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///workspace')
                }
                branches('*/main')
              }
            }
            scriptPath('microservicios/gestion-vacaciones/Jenkinsfile')
