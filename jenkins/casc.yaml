# Reto 7 P2 — Aprovisionamiento de pipelines como código (Opción A: JCasC + job-dsl).
# Al levantar Jenkins con `docker compose up`, estos jobs ya existen: cada uno
# lee su Jenkinsfile versionado junto al código (empleados/Jenkinsfile,
# vacaciones/Jenkinsfile) del repo montado en /workspace, rama del reto.
# Decisión: JCasC frente a init.groovy.d porque es declarativo, se revisa como
# YAML y el plugin configuration-as-code ya viene pre-instalado (P1).
jenkins:
  systemMessage: "Reto 7 — CI del ecosistema (jobs aprovisionados como código)"
  numExecutors: 2

jobs:
  - script: >
      pipelineJob('empleados-service') {
        description('CI empleados-service (Java 21 + Maven). Jenkinsfile: empleados/Jenkinsfile.')
        // Polling P5-automatización: file:///workspace no admite webhook;
        // Jenkins revisa la rama cada ~2 min y dispara solo con cambio nuevo.
        triggers {
          scm('H/2 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///workspace')
                }
                branches('*/reto-8-observabilidad-monitoreo')
              }
            }
            scriptPath('empleados/Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('vacaciones-service') {
        description('CI vacaciones-service (Ruby 3.3 + Minitest). Jenkinsfile: vacaciones/Jenkinsfile.')
        // Polling P5-automatización: file:///workspace no admite webhook;
        // Jenkins revisa la rama cada ~2 min y dispara solo con cambio nuevo.
        triggers {
          scm('H/2 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///workspace')
                }
                branches('*/reto-8-observabilidad-monitoreo')
              }
            }
            scriptPath('vacaciones/Jenkinsfile')
          }
        }
      }

# Reto 7 P3 — Token de SonarQube como credencial Jenkins (el valor llega por
# entorno SONAR_TOKEN desde .env, nunca queda en git) y servidor SonarQube
# para el paso waitForQualityGate (resoluble desde el controller).
# ${JWT_SECRET} no es variable de entorno: JCasC lo resuelve con su fuente de
# secretos Docker, leyendo /run/secrets/JWT_SECRET (Docker secret jwt_secret
# montado por docker-compose.yml; el archivo lo genera scripts/setup-secrets.sh).
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "Token SonarQube para el análisis CI"
          - string:
              scope: GLOBAL
              id: "jwt-secret"
              secret: "${JWT_SECRET}"
              description: "JWT para los stacks E2E desechables (nunca en git)"

# (El servidor SonarQube para waitForQualityGate se configura por script
# init.groovy.d — el plugin sonar de esta versión no expone raíz CasC.)
