# Configuración de Behave para el proyecto E2E (Reto 6).
#
# Ejecutar siempre desde e2e-tests/ (o con el wrapper ./run_bdd.sh):
#   cd e2e-tests && .venv/bin/behave      (o `behave` con el venv activado)
#
# Reportes generados en cada corrida (equivalen a:
#   behave -f json -o reports/cucumber.json -f html -o reports/cucumber.html \
#          --junit --junit-directory reports):
#   - reports/cucumber.json   -> formatter JSON (cucumber)
#   - reports/cucumber.html   -> reporte HTML navegable (behave-html-formatter)
#   - reports/TESTS-*.xml     -> reporte JUnit XML
# Cuando no se pasa `-f` por CLI, behave añade el formatter `pretty` a stdout,
# así que `behave` a secas muestra el resultado en consola y genera los reportes.

[behave]
# `format` y `outfiles` se leen como listas: cada formatter se empareja con su
# archivo por posición. `default_format=pretty` se agrega a stdout cuando no se
# pasa `-f` por CLI, así que una corrida a secas deja los 3 reportes y consola.
format = json
         html
outfiles = reports/cucumber.json
           reports/cucumber.html
default_format = pretty

junit = true
junit_directory = reports

# behave 1.3 ya no autodescubre entry points de pip: el formatter HTML aportado
# por behave-html-formatter (requirements.txt) se registra aquí por nombre.
[behave.formatters]
html = behave_html_formatter:HTMLFormatter
