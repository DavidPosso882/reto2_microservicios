services:
  database-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-auth_db}
      POSTGRES_USER: ${DB_AUTH_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD:-postgres}
    volumes:
      - vol-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUTH_USER:-postgres} -d ${DB_AUTH_NAME:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  auth-service:
    build: ./auth-service
    expose:
      - "8086"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8086
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${DB_AUTH_NAME:-auth_db}
      DB_USER: ${DB_AUTH_USER:-postgres}
      DB_PASSWORD: ${DB_AUTH_PASSWORD:-postgres}
      # Firmado de JWT: el gateway valida con la MISMA clave (Reto 5).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      database-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-empleados:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-gestion_empleados}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_EMPLEADOS_PASSWORD:-postgres}
    volumes:
      - vol-empleados:/var/lib/postgresql/data
      - ./empleados/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_EMPLEADOS_USER:-postgres} -d ${DB_EMPLEADOS_NAME:-gestion_empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  database-departamentos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DEPARTAMENTOS_NAME:-departamentos}
      POSTGRES_USER: ${DB_DEPARTAMENTOS_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:-postgres}
    volumes:
      - vol-departamentos:/var/lib/postgresql/data
      - ./departamentos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DEPARTAMENTOS_USER:-postgres} -d ${DB_DEPARTAMENTOS_NAME:-departamentos}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  departamentos-service:
    build: ./departamentos
    expose:
      - "8082"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8082
      DB_HOST: database-departamentos
      DB_PORT: 5432
      DB_NAME: ${DB_DEPARTAMENTOS_NAME:-departamentos}
      DB_USER: ${DB_DEPARTAMENTOS_USER:-postgres}
      DB_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:-postgres}
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/departamentos"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  empleados-service:
    build: ./empleados
    expose:
      - "8081"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8081
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-gestion_empleados}
      DB_USER: ${DB_EMPLEADOS_USER:-postgres}
      DB_PASSWORD: ${DB_EMPLEADOS_PASSWORD:-postgres}
      DEPARTAMENTOS_URL: http://departamentos-service:8082
      SPRING_RABBITMQ_HOST: message-broker
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_started
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/empleados"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network

  database-notificaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NOTIFICACIONES_NAME:-notificaciones}
      POSTGRES_USER: ${DB_NOTIFICACIONES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_NOTIFICACIONES_PASSWORD:-postgres}
    volumes:
      - vol-notificaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_NOTIFICACIONES_USER:-postgres} -d ${DB_NOTIFICACIONES_NAME:-notificaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  notificaciones-service:
    build: ./notificaciones
    expose:
      - "8084"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8084
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${DB_NOTIFICACIONES_NAME:-notificaciones}
      DB_USER: ${DB_NOTIFICACIONES_USER:-postgres}
      DB_PASSWORD: ${DB_NOTIFICACIONES_PASSWORD:-postgres}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      database-notificaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-perfiles:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_PERFILES_NAME:-perfiles}
      POSTGRES_USER: ${DB_PERFILES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PERFILES_PASSWORD:-postgres}
    volumes:
      - vol-perfiles:/var/lib/postgresql/data
      - ./perfiles/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PERFILES_USER:-postgres} -d ${DB_PERFILES_NAME:-perfiles}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  perfiles-service:
    build: ./perfiles
    expose:
      - "8083"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8083
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${DB_PERFILES_NAME:-perfiles}
      DB_USER: ${DB_PERFILES_USER:-postgres}
      DB_PASSWORD: ${DB_PERFILES_PASSWORD:-postgres}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      database-perfiles:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-vacaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_VACACIONES_PASSWORD:-postgres}
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
      - ./vacaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VACACIONES_USER:-postgres} -d ${DB_VACACIONES_NAME:-vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  vacaciones-service:
    build: ./vacaciones
    expose:
      - "8085"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-postgres}
      DB_PASSWORD: ${DB_VACACIONES_PASSWORD:-postgres}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      database-vacaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  # ── Mensajería asincrónica (Reto 4): eventos del ecosistema ──
  message-broker:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP: productores y consumidores
      - "15672:15672"   # Management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

  # ── Borde del sistema (Reto 3): único servicio con puertos al host ──
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"   # ← el ÚNICO puerto publicado al host
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EMPLEADOS_URL: http://empleados-service:8081
      DEPARTAMENTOS_URL: http://departamentos-service:8082
      PERFILES_URL: http://perfiles-service:8083
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
      AUTH_URL: http://auth-service:8086
    depends_on:
      empleados-service:
        condition: service_started
      departamentos-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  # ── Integración Continua (Reto 7, P1): Jenkins ──
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    ports:
      - "9090:8080"     # Interfaz web
      - "50000:50000"   # Comunicación con agentes
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/jobs.yaml:ro
      # Repo como SCM local (P2, Opción A): los jobs clonan file:///workspace.
      - ./:/workspace:ro
      # El worktree resuelve sus objetos en el .git principal del host;
      # montarlo en la misma ruta absoluta hace que el clone file:// funcione.
      - /home/david/Documentos/Semestre9/reto2/.git:/home/david/Documentos/Semestre9/reto2/.git:ro
      - /var/run/docker.sock:/var/run/docker.sock   # Acceso al Docker del host
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      - SONAR_TOKEN=${SONAR_TOKEN:-}   # Reto 7 P3: JCasC lo usa como credencial (ver casc.yaml)
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}   # Reto 7 P4: JCasC lo usa como credencial jwt-secret
    networks:
      - microservices-network

  # ── Calidad (Reto 7, P3): SonarQube + PostgreSQL ──
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - microservices-network

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ── Registro local (Reto 7, P4): las imágenes del pipeline se publican acá ──
  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-auth:
  vol-empleados:
  vol-departamentos:
  vol-notificaciones:
  vol-perfiles:
  vol-vacaciones:
  vol-rabbitmq:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:
