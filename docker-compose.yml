services:
  database-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-auth_db}
      POSTGRES_USER: ${DB_AUTH_USER:-postgres}
      # Docker secret (secrets/db_auth_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_auth_password
        target: db_password
    volumes:
      - vol-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUTH_USER:-postgres} -d ${DB_AUTH_NAME:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  auth-service:
    build: ./auth-service
    expose:
      - "8086"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8086
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${DB_AUTH_NAME:-auth_db}
      DB_USER: ${DB_AUTH_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password   # Docker secret
      # Firmado de JWT: el gateway valida con la MISMA clave (Reto 5).
      # Docker secret (secrets/jwt_secret), nunca variable con valor.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    secrets:
      - source: db_auth_password
        target: db_password
      - source: jwt_secret
        target: jwt_secret
    depends_on:
      database-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-empleados:
    build:
      context: ./empleados
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-gestion_empleados}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-postgres}
      # Docker secret (secrets/db_empleados_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_empleados_password
        target: db_password
    volumes:
      - vol-empleados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_EMPLEADOS_USER:-postgres} -d ${DB_EMPLEADOS_NAME:-gestion_empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  database-departamentos:
    build:
      context: ./departamentos
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${DB_DEPARTAMENTOS_NAME:-departamentos}
      POSTGRES_USER: ${DB_DEPARTAMENTOS_USER:-postgres}
      # Docker secret (secrets/db_departamentos_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_departamentos_password
        target: db_password
    volumes:
      - vol-departamentos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DEPARTAMENTOS_USER:-postgres} -d ${DB_DEPARTAMENTOS_NAME:-departamentos}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  departamentos-service:
    build: ./departamentos
    expose:
      - "8082"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8082
      DB_HOST: database-departamentos
      DB_PORT: 5432
      DB_NAME: ${DB_DEPARTAMENTOS_NAME:-departamentos}
      DB_USER: ${DB_DEPARTAMENTOS_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password   # Docker secret
    secrets:
      - source: db_departamentos_password
        target: db_password
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/departamentos"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  empleados-service:
    build: ./empleados
    expose:
      - "8081"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8081
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-gestion_empleados}
      DB_USER: ${DB_EMPLEADOS_USER:-postgres}
      # DB_PASSWORD llega como Docker secret en /run/secrets/DB_PASSWORD
      # (spring.config.import=configtree, ver application.properties).
      DEPARTAMENTOS_URL: http://departamentos-service:8082
      SPRING_RABBITMQ_HOST: message-broker
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    secrets:
      - source: db_empleados_password
        target: DB_PASSWORD
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_started
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/empleados"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network

  database-notificaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NOTIFICACIONES_NAME:-notificaciones}
      POSTGRES_USER: ${DB_NOTIFICACIONES_USER:-postgres}
      # Docker secret (secrets/db_notificaciones_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_notificaciones_password
        target: db_password
    volumes:
      - vol-notificaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_NOTIFICACIONES_USER:-postgres} -d ${DB_NOTIFICACIONES_NAME:-notificaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  notificaciones-service:
    build: ./notificaciones
    expose:
      - "8084"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8084
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${DB_NOTIFICACIONES_NAME:-notificaciones}
      DB_USER: ${DB_NOTIFICACIONES_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password   # Docker secret
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    secrets:
      - source: db_notificaciones_password
        target: db_password
    depends_on:
      database-notificaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-perfiles:
    build:
      context: ./perfiles
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${DB_PERFILES_NAME:-perfiles}
      POSTGRES_USER: ${DB_PERFILES_USER:-postgres}
      # Docker secret (secrets/db_perfiles_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_perfiles_password
        target: db_password
    volumes:
      - vol-perfiles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PERFILES_USER:-postgres} -d ${DB_PERFILES_NAME:-perfiles}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  perfiles-service:
    build: ./perfiles
    expose:
      - "8083"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8083
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${DB_PERFILES_NAME:-perfiles}
      DB_USER: ${DB_PERFILES_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password   # Docker secret
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    secrets:
      - source: db_perfiles_password
        target: db_password
    depends_on:
      database-perfiles:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  database-vacaciones:
    build:
      context: ./vacaciones
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-postgres}
      # Docker secret (secrets/db_vacaciones_password): nunca en el compose.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_vacaciones_password
        target: db_password
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VACACIONES_USER:-postgres} -d ${DB_VACACIONES_NAME:-vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  vacaciones-service:
    build: ./vacaciones
    expose:
      - "8085"   # visible solo dentro de la red de Docker (Reto 3: borde único)
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password   # Docker secret
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    secrets:
      - source: db_vacaciones_password
        target: db_password
    depends_on:
      database-vacaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  # ── Mensajería asincrónica (Reto 4): eventos del ecosistema ──
  message-broker:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP: productores y consumidores
      - "15672:15672"   # Management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # La guarda evita que el CLI (root) cree .erlang.cookie antes que el servidor:
      # con la cookie de root, RabbitMQ muere con eacces si arranca lento.
      test: ["CMD-SHELL", "test -s /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

  # ── Borde del sistema (Reto 3): único servicio con puertos al host ──
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"   # ← el ÚNICO puerto publicado al host
    environment:
      PORT: 8080
      JWT_SECRET_FILE: /run/secrets/jwt_secret   # Docker secret
      EMPLEADOS_URL: http://empleados-service:8081
      DEPARTAMENTOS_URL: http://departamentos-service:8082
      PERFILES_URL: http://perfiles-service:8083
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
      AUTH_URL: http://auth-service:8086
    secrets:
      - source: jwt_secret
        target: jwt_secret
    depends_on:
      empleados-service:
        condition: service_started
      departamentos-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  # ── Integración Continua (Reto 7, P1): Jenkins ──
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    ports:
      - "9090:8080"     # Interfaz web
      - "50000:50000"   # Comunicación con agentes
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/jobs.yaml:ro
      # Repo como SCM local (P2, Opción A): los jobs clonan file:///workspace.
      - ./:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock   # Acceso al Docker del host
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      - SONAR_TOKEN=${SONAR_TOKEN:-}   # Reto 7 P3: JCasC lo usa como credencial (ver casc.yaml)
    # Reto 7 P4: JCasC resuelve ${JWT_SECRET} leyendo /run/secrets/JWT_SECRET
    # (fuente de secretos Docker integrada en configuration-as-code) y lo
    # registra como la credencial jwt-secret de los stacks E2E.
    secrets:
      - source: jwt_secret
        target: JWT_SECRET
      - jenkins_admin_password   # init.groovy.d/create-admin.groovy
    networks:
      - microservices-network

  # ── Calidad (Reto 7, P3): SonarQube + PostgreSQL ──
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - microservices-network

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD vacío, ejecuta bash scripts/setup-secrets.sh}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ── Registro local (Reto 7, P4): las imágenes del pipeline se publican acá ──
  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - microservices-network

  # ── Observabilidad (Reto 8, S3+S8): Prometheus + Grafana + Loki/Promtail + Zipkin ──
  #
  # DECISIÓN — conflicto del puerto 9090:
  #   El reto pide Prometheus en el 9090, pero Jenkins (Reto 7) ya publica el
  #   9090 del host con "9090:8080". Para no romper Jenkins, Prometheus se
  #   publica como "9091:9090":
  #     - contenedor: 9090  → estándar de la imagen y URL que usan Grafana y el
  #                          propio Prometheus (http://prometheus:9090)
  #     - host:       9091  → http://localhost:9091
  #   El puerto de Jenkins NO se modifica.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"   # host 9091 → contenedor 9090 (9090 del host es de Jenkins)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle   # permite recargar la config sin recrear el contenedor
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"   # http://localhost:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password   # Docker secret
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Reto 8 T3: canal Telegram (contact-points.yml expande $TELEGRAM_*).
      # Valores reales en .env (nunca en git); vacío = alertas sin envío.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana-data:/var/lib/grafana                                    # persistencia
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro # datasources + dashboards
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro  # JSON de T3
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
      - loki
    networks:
      - microservices-network

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    ports:
      - "3100:3100"   # API HTTP de Loki (push desde Promtail y queries desde Grafana)
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # S8: descubrir contenedores y leer sus logs
      - promtail-positions:/var/lib/promtail          # no reenvía logs ya leídos
    depends_on:
      - loki
    networks:
      - microservices-network

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"   # UI + API de ingesta (http://localhost:9411)
    environment:
      # Almacenamiento en memoria: suficiente para demo/CI y sin dependencias extra.
      STORAGE_TYPE: mem
      JAVA_OPTS: -Xms128m -Xmx512m
    networks:
      - microservices-network

# ── Secretos (Proyecto Final: cero secretos en el repositorio) ──
# Los archivos de secrets/ los genera `bash scripts/setup-secrets.sh` (están
# en .gitignore; las plantillas viven en secrets.example/). Compose los monta
# de solo lectura en /run/secrets/<target> de cada contenedor que los declara.
# En CI, docker-compose.e2e.yml los sustituye por variables de entorno
# efímeras que genera scripts/ci-compose.sh.
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  db_auth_password:
    file: ./secrets/db_auth_password
  db_empleados_password:
    file: ./secrets/db_empleados_password
  db_departamentos_password:
    file: ./secrets/db_departamentos_password
  db_notificaciones_password:
    file: ./secrets/db_notificaciones_password
  db_perfiles_password:
    file: ./secrets/db_perfiles_password
  db_vacaciones_password:
    file: ./secrets/db_vacaciones_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-auth:
  vol-empleados:
  vol-departamentos:
  vol-notificaciones:
  vol-perfiles:
  vol-vacaciones:
  vol-rabbitmq:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
