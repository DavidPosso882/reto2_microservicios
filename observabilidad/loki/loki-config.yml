# Reto 8 (S3) — Loki en modo "single binary" para un ecosistema local.
# Almacenamiento en filesystem dentro del volumen `loki-data` (sin S3 ni MinIO),
# suficiente para el alcance del reto y sin dependencias extra.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Índice TSDB (schema v13): requerido por Loki >= 2.9 y recomendado por upstream.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Los logs del reto son de sesiones cortas: no rechazar líneas por antigüedad.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h   # 7 días de retención
  allow_structured_metadata: true
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# Sin telemetría saliente: el ecosistema corre en local/CI.
analytics:
  reporting_enabled: false
