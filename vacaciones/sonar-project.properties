# Reto 7 P4 — Análisis SonarQube de vacaciones-service (Ruby).
# Lo usa la etapa SonarQube con la imagen sonarsource/sonar-scanner-cli:5.0.1
# (pin 5.x: compatible con SonarQube 9.9) y projectBaseDir=vacaciones/.
# La cobertura la genera la etapa Test (reports/coverage/coverage.xml Cobertura).
sonar.projectKey=vacaciones-service
sonar.projectName=Vacaciones Service
sonar.sources=app
sonar.host.url=http://localhost:9000
sonar.coverageReportPaths=reports/coverage/coverage.xml
# Auth y espera del Quality Gate por CLI (Basic; SQ 9.9 rechaza Bearer):
#   sonar-scanner -Dsonar.login=${SQ_TOKEN} -Dsonar.qualitygate.wait=true
