# Configuración exclusiva de tests: base de datos H2 en memoria.
# Sobrescribe application.properties del classpath principal para que
# los tests no dependan de PostgreSQL ni de un servicio de departamentos vivo.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera el esquema desde las entidades JPA (incluye UNIQUE de email/numeroEmpleado).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# URL del servicio de departamentos: en los tests se sustituye por un stub (@MockBean),
# así que esta URL nunca llega a usarse.
departamentos.url=http://localhost:9999
