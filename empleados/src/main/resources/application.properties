# Puerto del servidor (configurable por variable de entorno PORT)
server.port=${PORT:8081}

# Nombre de la aplicacion
spring.application.name=gestion-empleados

# Deshabilitar pagina de error de Whitelabel para manejar errores manualmente
server.error.whitelabel.enabled=false

# No exponer detalles del error en la respuesta (seguridad)
server.error.include-message=never
server.error.include-binding-errors=never

# --- Persistencia PostgreSQL (Reto 2) ---
# Configurada desde variables de entorno con valores locales por defecto.
# La contraseña NO tiene valor por defecto (Proyecto Final: cero secretos).
# En Docker llega como Docker secret montado en /run/secrets/DB_PASSWORD:
# configtree convierte cada archivo de esa carpeta en una propiedad con su
# nombre, así que ${DB_PASSWORD} se resuelve desde el archivo. Fuera de Docker
# (sin la carpeta, por eso "optional:") se usa la variable de entorno DB_PASSWORD.
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion_empleados}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema (tabla + restricciones UNIQUE) se gestiona con empleados/init.sql.
# ddl-auto=none evita que Hibernate genere el esquema y respeta el script.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Servicio de departamentos (Reto 2) ---
# URL base del servicio de departamentos. Se llama a {DEPARTAMENTOS_URL}/departamentos/{id}.
departamentos.url=${DEPARTAMENTOS_URL:http://localhost:8082}

# --- Swagger / OpenAPI (Reto 4: vía gateway con strip, Try-it-out con forwarded headers) ---
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework

# --- Observabilidad (Reto 8) ---
# Prometheus se expone en /actuator/prometheus y el controlador propio lo
# publica en /metrics (contrato del reto).
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=empleados-service
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# El /health propio hace las comprobaciones reales de DB y RabbitMQ.
management.health.rabbit.enabled=false
management.health.db.enabled=false
