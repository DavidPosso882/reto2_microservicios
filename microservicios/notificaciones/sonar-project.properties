# Proyecto Final — Análisis SonarQube de notificaciones-service (Python 3.12).
# Lo usa la etapa SonarQube con sonarsource/sonar-scanner-cli:5.0.1.
# Cobertura: Cobertura XML generado por la etapa Test
# (reports/coverage.xml vía pytest-cov).
sonar.projectKey=notificaciones-service
sonar.projectName=Notificaciones Service
sonar.sources=app
sonar.tests=tests
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.sourceEncoding=UTF-8
# Auth y espera del Quality Gate por CLI (Basic; SQ 9.9 rechaza Bearer):
#   sonar-scanner -Dsonar.login=${SQ_TOKEN} -Dsonar.qualitygate.wait=true
