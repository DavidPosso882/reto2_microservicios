# Proyecto Final — Análisis SonarQube de auth-service (Node 22).
# Lo usa la etapa SonarQube con sonarsource/sonar-scanner-cli:5.0.1.
# Cobertura: LCOV generado por la etapa Test (coverage/lcov.info, reporter
# lcov built-in de Node 22, sin dependencias extra).
sonar.projectKey=auth-service
sonar.projectName=Auth Service
sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/reports/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Auth y espera del Quality Gate por CLI (Basic; SQ 9.9 rechaza Bearer):
#   sonar-scanner -Dsonar.login=${SQ_TOKEN} -Dsonar.qualitygate.wait=true
