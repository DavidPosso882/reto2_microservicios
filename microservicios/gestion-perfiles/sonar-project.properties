# Proyecto Final — Análisis SonarQube de perfiles-service (Go 1.26).
# Lo usa la etapa SonarQube con sonarsource/sonar-scanner-cli:5.0.1.
# Cobertura: coverprofile generado por la etapa Test (coverage.out,
# sonar.go.coverage.reportPaths). El gate 70% vive además en la etapa Test
# (shell sobre go tool cover -func), sin depender del servidor Sonar.
sonar.projectKey=perfiles-service
sonar.projectName=Perfiles Service
sonar.sources=internal,cmd
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
# Alcance unitario (igual que el gate Jenkins): el main y el store Postgres
# necesitan runtime vivo y los cubre el BDD contra el stack desplegado.
sonar.coverage.exclusions=cmd/**,internal/store/postgres/**
sonar.sourceEncoding=UTF-8
# Auth y espera del Quality Gate por CLI (Basic; SQ 9.9 rechaza Bearer):
#   sonar-scanner -Dsonar.login=${SQ_TOKEN} -Dsonar.qualitygate.wait=true
