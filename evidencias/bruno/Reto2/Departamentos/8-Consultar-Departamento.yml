info:
  name: 8-Consultar-Departamento
  type: http
  seq: 2

http:
  method: GET
  url: "{{departamentos_url}}/departamentos/IT"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Devuelve el id IT", function() {
          expect(res.getBody().id).to.equal("IT");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
