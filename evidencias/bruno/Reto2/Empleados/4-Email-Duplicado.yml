info:
  name: 4-Email-Duplicado
  type: http
  seq: 3

http:
  method: POST
  url: "{{empleados_url}}/empleados"
  body:
    type: json
    data: |-
      {
        "id": "E002",
        "nombre": "Ana",
        "apellido": "Lopez",
        "email": "juan.perez@empresa.com",
        "numeroEmpleado": "EMP-2026-002",
        "cargo": "QA",
        "area": "Tecnologia",
        "departamentoId": "IT",
        "fechaIngreso": "2026-02-11"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });
        test("Body status 400", function() {
          expect(res.getBody().status).to.equal(400);
        });
        test("Error email duplicado", function() {
          expect(res.getBody().error).to.include("El email 'juan.perez@empresa.com' ya está registrado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
