info:
  name: 16-Consultar-Periodo
  type: http
  seq: 2

http:
  method: GET
  url: "{{gateway_url}}/vacaciones/V-2026-0001"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Estado PROGRAMADA (o CANCELADA si ya se corrió 21)", function() {
          expect(["PROGRAMADA", "CANCELADA"]).to.include(res.getBody().estado);
        });
        // El id secuencial depende del estado de la BD: con volúmenes limpios
        // es V-2026-0001; si da 404, mirá el id devuelto por 15 y ajustá la URL.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
