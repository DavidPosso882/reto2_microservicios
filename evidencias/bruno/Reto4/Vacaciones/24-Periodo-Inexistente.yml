info:
  name: 24-Periodo-Inexistente
  type: http
  seq: 8

http:
  method: GET
  url: "{{gateway_url}}/vacaciones/V-9999-9999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });
        test("Mensaje exacto", function() {
          expect(res.getBody().error).to.equal("El período de vacaciones 'V-9999-9999' no existe");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
