info:
  name: 20-400-Empleado-Inexistente
  type: http
  seq: 6

http:
  method: POST
  url: "{{gateway_url}}/vacaciones"
  body:
    type: json
    data: |-
      {
        "empleadoId": "E999",
        "fechaInicio": "2027-07-10",
        "fechaFin": "2027-07-20"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });
        test("Mensaje exacto de la réplica local", function() {
          expect(res.getBody().error).to.equal("El empleado 'E999' no existe en la réplica local (aún no llegó el evento empleado.creado)");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
