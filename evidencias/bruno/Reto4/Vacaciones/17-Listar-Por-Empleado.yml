info:
  name: 17-Listar-Por-Empleado
  type: http
  seq: 3

http:
  method: GET
  url: "{{gateway_url}}/vacaciones?empleadoId=E200"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Devuelve un arreglo", function() {
          expect(Array.isArray(res.getBody())).to.equal(true);
        });
        test("Todos son de E200", function() {
          expect(res.getBody().every(function(p) { return p.empleadoId === "E200"; })).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
