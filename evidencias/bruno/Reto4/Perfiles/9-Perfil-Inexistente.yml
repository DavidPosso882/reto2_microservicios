info:
  name: 9-Perfil-Inexistente
  type: http
  seq: 1

http:
  method: GET
  url: "{{gateway_url}}/perfiles/E999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });
        test("Envoltorio del ecosistema", function() {
          expect(res.getBody().status).to.equal(404);
        });
        test("Mensaje exacto", function() {
          expect(res.getBody().error).to.equal("El perfil del empleado 'E999' no existe");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
