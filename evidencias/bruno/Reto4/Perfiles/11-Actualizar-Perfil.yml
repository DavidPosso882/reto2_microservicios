info:
  name: 11-Actualizar-Perfil
  type: http
  seq: 3

http:
  method: PUT
  url: "{{gateway_url}}/perfiles/E200"
  body:
    type: json
    data: |-
      {
        "telefono": "+54-11-5555-1234",
        "ciudad": "Buenos Aires",
        "biografia": "Backend dev"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Telefono persistido", function() {
          expect(res.getBody().telefono).to.equal("+54-11-5555-1234");
        });
        // La identidad (nombre/apellido/email) del body se IGNORA: solo se
        // sincroniza por eventos (empleado.creado / empleado.actualizado).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
