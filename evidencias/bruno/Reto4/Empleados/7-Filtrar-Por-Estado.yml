info:
  name: 7-Filtrar-Por-Estado
  type: http
  seq: 5

http:
  method: GET
  url: "{{gateway_url}}/empleados?estado=ACTIVO"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Devuelve un arreglo", function() {
          expect(Array.isArray(res.getBody())).to.equal(true);
        });
        test("Todos ACTIVO", function() {
          expect(res.getBody().every(function(e) { return e.estado === "ACTIVO"; })).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
