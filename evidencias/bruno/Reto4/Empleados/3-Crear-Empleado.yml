info:
  name: 3-Crear-Empleado
  type: http
  seq: 1

http:
  method: POST
  url: "{{gateway_url}}/empleados"
  body:
    type: json
    data: |-
      {
        "id": "E200",
        "nombre": "Maria",
        "apellido": "Lopez",
        "email": "maria.lopez@empresa.com",
        "numeroEmpleado": "NUM-200",
        "cargo": "Desarrolladora Senior",
        "area": "Tecnologia",
        "departamentoId": "IT",
        "fechaIngreso": "2026-02-10"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });
        test("Estado ACTIVO", function() {
          expect(res.getBody().estado).to.equal("ACTIVO");
        });
        // El efecto asincrónico (perfil, BIENVENIDA, réplica) NO está en esta
        // respuesta: esperar ~15s y re-ejecutar 10-Consultar-Perfil y
        // 14-Notificaciones-Por-Empleado.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
