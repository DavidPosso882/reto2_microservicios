info:
  name: 23-Filtro-Retirados-Rango
  type: http
  seq: 8

http:
  method: GET
  url: "{{gateway_url}}/empleados?estado=RETIRADO&desde=2026-01-01&hasta=2027-12-31"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Auditoría: E200 sigue listado (rango de fechaRetiro)", function() {
          expect(res.getBody().some(function(e) { return e.id === "E200"; })).to.equal(true);
        });
        test("Todos RETIRADO", function() {
          expect(res.getBody().every(function(e) { return e.estado === "RETIRADO"; })).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
