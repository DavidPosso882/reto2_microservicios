info:
  name: 5-Listar-Empleados
  type: http
  seq: 3

http:
  method: GET
  url: "{{gateway_url}}/empleados"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Devuelve un arreglo", function() {
          expect(Array.isArray(res.getBody())).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
