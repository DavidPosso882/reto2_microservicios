info:
  name: 1-Crear-Departamento
  type: http
  seq: 1

http:
  method: POST
  url: "{{gateway_url}}/departamentos"
  body:
    type: json
    data: |-
      {
        "id": "IT",
        "nombre": "Tecnologia",
        "descripcion": "Departamento de TI"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 201 (o 400 si ya existe de una corrida previa)", function() {
          expect([201, 400]).to.include(res.getStatus());
        });
        if (res.getStatus() === 201) {
          test("Devuelve el departamento creado", function() {
            expect(res.getBody().id).to.equal("IT");
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
