info:
  name: 14-Notificaciones-Por-Empleado
  type: http
  seq: 2

http:
  method: GET
  url: "{{gateway_url}}/notificaciones/E200"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Devuelve un arreglo", function() {
          expect(Array.isArray(res.getBody())).to.equal(true);
        });
        test("Todas son de E200", function() {
          expect(res.getBody().every(function(n) { return n.empleadoId === "E200"; })).to.equal(true);
        });
        // ASINCRÓNICO — re-ejecutar este request tras ~15s de cada evento:
        //   tras 3-Crear-Empleado  → 1 BIENVENIDA
        //   tras 15-Programar-Vacaciones → aparece VACACIONES
        //   tras 22-Retirar-Empleado → aparece DESVINCULACION
        // Si el arreglo viene vacío, el consumer aún no procesó: esperar y
        // volver a ejecutar. La dedup (mismo envelope id dos veces) NO va en
        // Bruno: se publica directo al exchange vía Management API (guía §5).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
