# Reto 7 P4 — Override para el stack E2E aislado (proyecto reto7-e2e).
# Cambia los port bindings que colisionan con el stack principal del host, para
# que el E2E de Jenkins y el sistema principal puedan estar encendidos a la vez.
# `ports: []` NO sirve: Compose fusiona listas de puertos; hacen falta las
# etiquetas !reset / !override (Compose >= 2.24; CI usa v2.29.7).
# Uso en ci-compose.sh: se pasa junto al docker-compose.yml principal.
services:
  message-broker:
    ports: !reset []   # sin binding al host: 5672/15672 quedan para el stack principal
    hostname: reto7-e2e-rabbit   # hostname fijo: evita conflicto de Erlang cookie entre reinicios
    image: rabbitmq:3-alpine     # imagen ligera sin management UI: menos memoria
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  api-gateway:
    # La suite BDD (agente con --network host) entra por localhost:18080;
    # el 8080 queda libre para el gateway del stack principal.
    ports: !override
      - "18080:8080"
    restart: on-failure:5
  # Bajo carga, un servicio puede morir al arrancar por un fallo transitorio
  # (p. ej. UnknownHostException de la BD) y dejar caída toda la corrida.
  auth-service:
    restart: on-failure:5
  departamentos-service:
    restart: on-failure:5
  empleados-service:
    restart: on-failure:5
  notificaciones-service:
    restart: on-failure:5
  perfiles-service:
    restart: on-failure:5
  vacaciones-service:
    restart: on-failure:5

# Proyecto Final — secretos en CI. En el compose principal los secretos son
# archivos de ./secrets/ (bind mounts). Aquí no sirven: Jenkins habla con el
# Docker del host por el socket, y la ruta del workspace del contenedor Jenkins
# no existe en el host. Con "environment:" Compose copia el valor dentro del
# contenedor (en /run/secrets/<target>) sin montar nada. scripts/ci-compose.sh
# genera valores aleatorios y efímeros para cada corrida (JWT_SECRET llega de
# la credencial jwt-secret de Jenkins).
secrets:
  jwt_secret: !override
    environment: JWT_SECRET
  db_auth_password: !override
    environment: DB_AUTH_PASSWORD
  db_empleados_password: !override
    environment: DB_EMPLEADOS_PASSWORD
  db_departamentos_password: !override
    environment: DB_DEPARTAMENTOS_PASSWORD
  db_notificaciones_password: !override
    environment: DB_NOTIFICACIONES_PASSWORD
  db_perfiles_password: !override
    environment: DB_PERFILES_PASSWORD
  db_vacaciones_password: !override
    environment: DB_VACACIONES_PASSWORD
  grafana_admin_password: !override
    environment: GRAFANA_ADMIN_PASSWORD
  jenkins_admin_password: !override
    environment: JENKINS_ADMIN_PASSWORD
